name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task3/app

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: task3/app/build/reports/

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: task3/app/build/libs/app.jar

      - name: Build Docker image
        run: docker build -t devops-app:${{ github.sha }} .